<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P 1:1 실시간 채팅 & 공유 그림판</title>
    <!-- PeerJS WebRTC 라이브러리 불러오기 -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        
        .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        /* 상단 접속 제어판 */
        .card { background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .connection-bar { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: space-between; }
        .input-group { display: flex; gap: 8px; align-items: center; }
        input[type="text"] { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { padding: 8px 16px; border: none; background: #4F46E5; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #4338CA; }
        button:disabled { background: #a5b4fc; cursor: not-allowed; }
        .status-badge { font-size: 14px; font-weight: bold; padding: 6px 12px; border-radius: 20px; background: #e5e7eb; color: #374151; }
        .status-connected { background: #d1fae5; color: #065f46; }

        /* 메인 컨텐츠 영역 */
        .main-content { display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* 그림판 */
        .paint-section { flex: 2; min-width: 500px; display: flex; flex-direction: column; align-items: center; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; width: 100%; justify-content: flex-start; align-items: center; }
        canvas { border: 2px solid #e5e7eb; border-radius: 8px; background: white; cursor: crosshair; touch-action: none; }

        /* 채팅창 */
        .chat-section { flex: 1; min-width: 300px; display: flex; flex-direction: column; height: 500px; }
        .chat-messages { flex: 1; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
        .message { padding: 8px 12px; border-radius: 8px; max-width: 80%; font-size: 14px; word-break: break-all; }
        .message.my { background: #4F46E5; color: white; align-self: flex-end; }
        .message.peer { background: #e5e7eb; color: #111827; align-self: flex-start; }
        .message.system { background: #feefc3; color: #713f12; align-self: center; font-size: 12px; }
        .chat-input-box { display: flex; gap: 8px; }
        .chat-input-box input { flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. P2P 접속 설정바 -->
    <div class="card connection-bar">
        <div class="input-group">
            <input type="text" id="myNick" placeholder="내 닉네임 입력">
            <button id="btnRegister" onclick="registerUser()">1. 닉네임 등록</button>
        </div>
        <div class="input-group">
            <input type="text" id="targetNick" placeholder="상대방 닉네임 입력" disabled>
            <button id="btnConnect" onclick="connectToPeer()" disabled>2. 상대방 연결</button>
        </div>
        <div id="statusBadge" class="status-badge">상태: 닉네임을 등록해주세요</div>
    </div>

    <!-- 2. 메인 컨텐츠 (그림판 & 채팅) -->
    <div class="main-content">
        <!-- 공유 그림판 -->
        <div class="card paint-section">
            <div class="toolbar">
                <label>색상: <input type="color" id="penColor" value="#000000"></label>
                <label>두께: <input type="range" id="penSize" min="1" max="20" value="3"></label>
                <button onclick="clearCanvas(true)">전체 지우기</button>
            </div>
            <canvas id="paintCanvas" width="550" height="420"></canvas>
        </div>

        <!-- 실시간 채팅 -->
        <div class="card chat-section">
            <h4 style="margin-bottom: 10px;">1:1 P2P 채팅</h4>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-box">
                <input type="text" id="msgInput" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)" disabled>
                <button id="btnSend" onclick="sendMessage()" disabled>전송</button>
            </div>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let conn = null;
    let myNickname = '';
    
    // Canvas 변수
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let prevX = 0, prevY = 0;

    // --- [1] P2P 네트워크 초기화 & 연결 ---

    function registerUser() {
        const nickInput = document.getElementById('myNick');
        myNickname = nickInput.value.trim();

        if (!myNickname) {
            alert('사용할 닉네임을 입력하세요.');
            return;
        }

        // PeerJS 객체 생성 (닉네임을 P2P ID로 사용)
        // ※ 공용 PeerJS 시그널링 서버를 사용하여 브라우저끼리 연결 통로를 생성합니다.
        peer = new Peer(myNickname);

        peer.on('open', (id) => {
            updateStatus(`내 ID: ${id} (상대방 연결 대기 중...)`, false);
            document.getElementById('myNick').disabled = true;
            document.getElementById('btnRegister').disabled = true;
            document.getElementById('targetNick').disabled = false;
            document.getElementById('btnConnect').disabled = false;
            appendSystemMessage('닉네임이 성공적으로 등록되었습니다.');
        });

        // 다른 유저가 나에게 연결을 요청했을 때
        peer.on('connection', (incomingConn) => {
            conn = incomingConn;
            setupDataChannel();
            updateStatus(`[${conn.peer}]님과 P2P 연결됨!`, true);
            appendSystemMessage(`[${conn.peer}]님이 접속하셨습니다.`);
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                alert('이미 사용 중인 닉네임입니다. 다른 닉네임을 입력해주세요.');
            } else {
                alert('P2P 오류 발생: ' + err.type);
            }
        });
    }

    function connectToPeer() {
        const targetNickname = document.getElementById('targetNick').value.trim();
        if (!targetNickname) {
            alert('상대방 닉네임을 입력하세요.');
            return;
        }
        if (targetNickname === myNickname) {
            alert('자기 자신에게는 연결할 수 없습니다.');
            return;
        }

        // 상대방 닉네임으로 P2P 데이터 채널 연결 시도
        conn = peer.connect(targetNickname);

        conn.on('open', () => {
            setupDataChannel();
            updateStatus(`[${targetNickname}]님과 P2P 연결됨!`, true);
            appendSystemMessage(`[${targetNickname}]님에게 연결되었습니다.`);
        });

        conn.on('error', (err) => {
            alert('상대방 연결 실패: 닉네임을 확인해주세요.');
        });
    }

    // P2P 송수신 이벤트 설정
    function setupDataChannel() {
        // UI 활성화
        document.getElementById('msgInput').disabled = false;
        document.getElementById('btnSend').disabled = false;
        document.getElementById('targetNick').disabled = true;
        document.getElementById('btnConnect').disabled = true;

        // 상대방으로부터 P2P 데이터를 수신했을 때
        conn.on('data', (data) => {
            if (data.type === 'chat') {
                appendPeerMessage(data.sender, data.text);
            } else if (data.type === 'draw') {
                drawRemoteLine(data);
            } else if (data.type === 'clear') {
                clearCanvasLocal();
            }
        });

        conn.on('close', () => {
            updateStatus('상대방과의 연결이 끊겼습니다.', false);
            appendSystemMessage('상대방과의 P2P 연결이 종료되었습니다.');
            document.getElementById('msgInput').disabled = true;
            document.getElementById('btnSend').disabled = true;
            conn = null;
        });
    }

    function updateStatus(text, isConnected) {
        const badge = document.getElementById('statusBadge');
        badge.innerText = text;
        if (isConnected) badge.classList.add('status-connected');
        else badge.classList.remove('status-connected');
    }

    // --- [2] 채팅 기능 ---

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();

        if (text && conn) {
            // P2P로 메시지 전송
            conn.send({ type: 'chat', sender: myNickname, text: text });
            appendMyMessage(text);
            input.value = '';
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function appendMyMessage(text) {
        const msgBox = document.getElementById('chatMessages');
        msgBox.innerHTML += `<div class="message my">${escapeHtml(text)}</div>`;
        msgBox.scrollTop = msgBox.scrollHeight;
    }

    function appendPeerMessage(sender, text) {
        const msgBox = document.getElementById('chatMessages');
        msgBox.innerHTML += `<div class="message peer"><strong>${escapeHtml(sender)}:</strong> ${escapeHtml(text)}</div>`;
        msgBox.scrollTop = msgBox.scrollHeight;
    }

    function appendSystemMessage(text) {
        const msgBox = document.getElementById('chatMessages');
        msgBox.innerHTML += `<div class="message system">${escapeHtml(text)}</div>`;
        msgBox.scrollTop = msgBox.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- [3] 실시간 그림판 기능 (P2P 좌표 전송) ---

    // 마우스 & 터치 좌표 구하기
    function getCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startDrawing(e) {
        isDrawing = true;
        const coords = getCoordinates(e);
        prevX = coords.x;
        prevY = coords.y;
    }

    function draw(e) {
        if (!isDrawing) return;
        const coords = getCoordinates(e);
        const color = document.getElementById('penColor').value;
        const size = document.getElementById('penSize').value;

        // 내 화면에 선 그리기
        drawLine(prevX, prevY, coords.x, coords.y, color, size);

        // 상대방에게 P2P로 좌표 및 서식 데이터 보내기
        if (conn) {
            conn.send({
                type: 'draw',
                x1: prevX, y1: prevY,
                x2: coords.x, y2: coords.y,
                color: color, size: size
            });
        }

        prevX = coords.x;
        prevY = coords.y;
    }

    function stopDrawing() { isDrawing = false; }

    function drawLine(x1, y1, x2, y2, color, size) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.closePath();
    }

    // 상대방이 보낸 그림 동기화
    function drawRemoteLine(data) {
        drawLine(data.x1, data.y1, data.x2, data.y2, data.color, data.size);
    }

    // 캔버스 지우기
    function clearCanvas(broadcast = true) {
        clearCanvasLocal();
        if (broadcast && conn) {
            conn.send({ type: 'clear' });
        }
    }

    function clearCanvasLocal() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // 마우스 및 터치 이벤트 연결
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { startDrawing(e); e.preventDefault(); });
    canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); });
    canvas.addEventListener('touchend', stopDrawing);
</script>

</body>
</html>
